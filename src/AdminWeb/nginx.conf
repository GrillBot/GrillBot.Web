events{}

http {
    include /etc/nginx/mime.types;

    map $http_user_agent $badagent {
        default 0;
        ~*AhrefsBot 1;
        ~*ALittle   1;
        ~*msie  1;
        ~*googlebot 1;
        ~*petalbot  1;
        ~*bingbot   1;
        ~*colly 1;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;
        server_tokens off;

        # add_header is not inherited into a location that sets its own, so every location includes this.
        include /etc/nginx/security-headers.conf;

        # The shell is revalidated on every load (ETag/Last-Modified stay on) so a deploy is picked up at once.
        # The SPA fallback below re-enters this location, so deep links get the same header.
        location = /index.html {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache";
        }

        # The production build hashes every script and stylesheet name (outputHashing: all), so these never change.
        # A missing file must 404 instead of falling back to index.html, which would serve HTML as a script.
        location ~* \.(?:js|css|woff2?|ttf|eot)$ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Unhashed static files (favicon, images).
        location ~* \.(?:ico|png|jpe?g|gif|svg|webp)$ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=3600";
            try_files $uri =404;
        }

        location / {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html;
        }

        if ($badagent) {
            return 403;
        }

        location ~ ^/(wp-admin|wp-login\.php) {
            return 403;
        }

        location ~ /\.(git|svn|ht|DS_Store) {
            deny all;
        }

        location /.env {
            return 403;
        }
    }
}
