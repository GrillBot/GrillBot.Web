@for (row of items() | chunk; track $index) {
  <c-row>
    @for (item of row; track $index) {
      <c-col>
        <c-form-check>
          <input
            cFormCheckInput
            type="radio"
            [name]="radioId()"
            [formControl]="formControl"
            [value]="item.value"
            [id]="radioId() + '-' + item.value"
          />

          <label cFormCheckLabel [attr.for]="radioId() + '-' + item.value">
            {{ item.label }}
          </label>
        </c-form-check>
      </c-col>
    }
  </c-row>
}
